name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Manual trigger so a deploy can be re-run without pushing a no-op commit.
  workflow_dispatch:

# Never let two deploys run at once: out-of-order Pages deployments can
# briefly serve an older build at the production URL.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Deploys must never ship a build that fails its own checks.
      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build
        run: pnpm build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=genai-games --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
